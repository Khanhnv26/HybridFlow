server.port=8080
spring.application.name=hybridflow-backend

# Datasource PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hybridflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.com.hybridflow=DEBUG
logging.level.org.springframework.web=INFO

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}

google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/connections/google/callback}
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
