server.port=8080
spring.application.name=hybridflow-backend

# Datasource PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hybridflow}
spring.datasource.username=${DB_USER:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.com.hybridflow=DEBUG
logging.level.org.springframework.web=INFO

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}

google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/connections/google/callback}
google.oauth.workspace-redirect-uri=${GOOGLE_WORKSPACE_REDIRECT_URI:http://localhost:8080/api/v1/workspaces/connections/google/callback}
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
google.oauth.encryption-key=${GOOGLE_CREDENTIAL_ENCRYPTION_KEY:}
hybridflow.scheduler.enabled=${SCHEDULER_ENABLED:true}
hybridflow.scheduler.workers=${SCHEDULER_WORKERS:5}
hybridflow.scheduler.lease-seconds=120
hybridflow.scheduler.max-attempts=3

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_LOGIN_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_LOGIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_LOGIN_CALLBACK:http://localhost:3000/login/oauth2/code/google}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
